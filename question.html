<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="stylesheet" href="css/style.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대답해줘</title>
</head>
<body>
    <article>
        <form action="">
            <h4>어떤 곰을 더 보고싶어?</h4>
            <input type="text" name="wantedBear" id="wantedBear">

            <h4>어떤 곰이 제일 맘에들어?</h4>
            <select name="favoriteBear" id="favoriteBear">
                <option value="bear-cut">곰돌이컷</option>
                <option value="pooh">곰돌이푸</option>
                <option value=" Asian-black-bear">반달가슴곰</option>
                <option value="polar-bear">북극곰</option>
                <option value="brown-bear">불곰</option>
            </select>

            <h4>이유를 말해봐</h4>
            <input type="text" name="reason" id="reason">
        </form>

        <button type="button" class="save-btn">저장</button>
        <button type="button" class="save-btn" onclick="history.back()">
            뒤로
        </button>

    </article>
</body>
</html>
